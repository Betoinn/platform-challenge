name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Minimum version allowed by required_version, and the latest one
        terraform: ["1.5.7", "1.16.4"]
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      # No backend and no cloud provider: init only prepares the working directory
      - name: Initialize
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Lint
        run: |
          tflint --init
          tflint -f compact
